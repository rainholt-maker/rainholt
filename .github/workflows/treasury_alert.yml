name: Sovereign Distress Monitor (<30 min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sovereign Market Monitor
        run: |
          python scripts/sovereign_monitor.py

      - name: Commit and Push Alert Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add treasury_events.json
          git diff --staged --quiet || (git commit -m "auto: update sovereign distress radar data" && git push origin main)
