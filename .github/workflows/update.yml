name: Update Newsletter

on:
  workflow_dispatch: # Giver dig en knap til at køre den manuelt
  schedule:
    - cron: '0 17 * * 5' # Kører automatisk hver fredag kl. 17:00 UTC

permissions:
  contents: write # Giver robotten lov til at gemme (commit) de nye filer

jobs:
  update-macro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run newsletter script
        run: python update_newsletter.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-update newsletter via GitHub Actions" || echo "Ingen ændringer at gemme"
          git push
