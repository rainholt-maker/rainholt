name: Auto-Update Økonomisk Ugebrev

on:
  schedule:
    # Kører hver fredag kl. 20:00 CEST (18:00 UTC)
    - cron: '0 18 * * 5'
  workflow_dispatch: # Gør det muligt at køre opdateringen manuelt via en knap

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run Update Script
        run: python update_ugebrev.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add arkiv.html
          git commit -m "Auto-update: Nyt makro-ugebrev tilføjet" || exit 0
          git push
