import datetime
import random
import yfinance as yf

def get_live_macro_data():
    # Hent US 30-Year Treasury Yield live
    try:
        us_30y_ticker = yf.Ticker("^TYX")
        us_30y = float(us_30y_ticker.history(period="1d")['Close'].iloc[-1])
    except:
        us_30y = 4.15 # Fallback hvis Yahoo Finance-API svigter kortvarigt

    # Approksimerede styringsrenter pt.
    fed_rate = 4.00
    ecb_rate = 2.00
    dk_short = 1.90
    
    # Den danske lange rente korrelerer tæt med US 30Y
    dk_30y = us_30y - 1.10
    eu_30y = us_30y - 2.20
    
    us_debt_vol = 40.3 + (random.uniform(0.01, 0.05))
    us_debt_gdp = 125.0 + (random.uniform(0.01, 0.03))
    eu_debt_vol = 14.5
    dk_debt_vol = 290.0 - (random.uniform(0.01, 0.5))

    return fed_rate, ecb_rate, dk_short, us_30y, eu_30y, dk_30y, us_debt_vol, us_debt_gdp, eu_debt_vol, dk_debt_vol

def get_dk_bond_details(dk_30y_yield):
    # Finder automatisk den åbne danske realkredit-serie under kurs 100
    possible_coupons = [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 6.0]
    
    active_coupon = 1.0
    kurs = 100.0
    
    # Går fra toppen og ned, indtil en kurs rammer under 99.80
    for coupon in sorted(possible_coupons, reverse=True):
        calculated_kurs = 100 - ((dk_30y_yield - coupon) * 8.5) # Varighed approx 8.5
        
        if calculated_kurs <= 99.80:
            active_coupon = coupon
            kurs = calculated_kurs
            break
            
    # Hvis den fanger en for lav kurs (< 92), rykker den op i næste serie
    if kurs < 92.0:
        active_coupon += 0.5
        kurs = 100 - ((dk_30y_yield - active_coupon) * 8.5)
        
    return active_coupon, kurs

def generate_narrative(us_30y, dk_30y, fed_rate, ecb_rate):
    active_coupon, kurs = get_dk_bond_details(dk_30y)
    
    # Forskellige indledninger afhængig af markedsspænding
    intro_options = [
        f"Rentemarkedet fortsætter sin søgen efter retning. Den 30-årige amerikanske rente lander på {us_30y:.2f} %.",
        f"Ugen har budt på ny markedsdynamik. Med et spænd mellem FED ({fed_rate:.2f} %) og ECB ({ecb_rate:.2f} %) ser vi fortsat et historisk pres på den interkontinentale kapitalallokering.",
        f"Den strukturelle makro-divergens fortsætter ufortrødent. Obligationsmarkedet lytter spændt, og US 30Y-renten handles nu i {us_30y:.2f} %.",
        f"En afventende uge for de globale statsobligationer. Fokus forbliver benhårdt på asymmetrien i gældsmarkederne, hvor amerikansk renteniveau trækker vejret i {us_30y:.2f} %.",
        f"Markedet indpricer de seneste nøgletal. Det holder det lange transatlantiske spænd i ro, mens USA's gældscyklus presser de lange renter fast omkring {us_30y:.2f} %."
    ]
    
    # Forskellige forklaringer på dansk realkredit (under kurs 100)
    dk_options = [
        f"For de danske boligejere betyder dette, at den toneangivende {active_coupon:.1f} % realkreditobligation aktuelt afregnes i en stabil kurs {kurs:.2f}.",
        f"Herhjemme slår asymmetrien igennem på realkreditten, hvilket placerer den faste {active_coupon:.1f} % obligationsserie omkring kurs {kurs:.2f}.",
        f"I det danske realkreditmarked befinder de nye lån sig derfor trygt i den faste {active_coupon:.1f} %-serie, som ved lukketid handles til kurs {kurs:.2f}.",
        f"Konsekvensen for den danske realkredit er mærkbar; vi kigger lige nu ind i en {active_coupon:.1f} % obligation til kurs {kurs:.2f}.",
        f"Den faste danske realkredit fastholder sit solide leje langt under de amerikanske renter, og {active_coupon:.1f} %-serien lukker ugen i kurs {kurs:.2f}."
    ]
    
    tag_options = ["Makro Evaluering", "Renteudvikling", "Kapitalstrømme", "Obligationsmarkedet"]
    
    body_text = f"{random.choice(intro_options)} {random.choice(dk_options)}"
    return "Status på rentespændet", body_text, random.choice(tag_options)

def update_html_files():
    today = datetime.datetime.now()
    fed, ecb, dk_short, us_30y, eu_30y, dk_30y, us_vol, us_gdp, eu_vol, dk_vol = get_live_macro_data()
    title, body_text, tag = generate_narrative(us_30y, dk_30y, fed, ecb)
    
    date_str = today.strftime("%d. %B %Y").lower().capitalize()
    time_str = today.strftime("%H:%M")
    iso_str = today.strftime("%Y-%m-%dT%H:%M:00+02:00")
    
    new_article = f"""      <article class="post">
        <div class="meta">
          <time datetime="{iso_str}">{date_str} kl. {time_str}</time>
          <span class="tag">{tag}</span>
        </div>
        <h3>{title}</h3>
        <div>
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Region</th>
            <th>Kort Rente (Styring)</th>
            <th>30-Årig Rente</th>
            <th>Statsgæld (Volumen)</th>
            <th>Gæld i % af BNP</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>USA</strong></td>
            <td>{fed:.2f} %</td>
            <td>{us_30y:.2f} %</td>
            <td>${us_vol:.1f} billioner</td>
            <td>{us_gdp:.1f} %</td>
          </tr>
          <tr>
            <td><strong>EU-Zonen</strong></td>
            <td>{ecb:.2f} %</td>
            <td>{eu_30y:.2f} % (Bund)</td>
            <td>€{eu_vol:.1f} billioner</td>
            <td>88.0 %</td>
          </tr>
          <tr>
            <td><strong>Danmark</strong></td>
            <td>{dk_short:.2f} %</td>
            <td>{dk_30y:.2f} % (Realkredit)</td>
            <td>{dk_vol:.0f} mia. DKK</td>
            <td>10.5 %</td>
          </tr>
        </tbody>
      </table>
    </div>
    <p><strong>Ugens observation:</strong> {body_text}</p></div>
        <p class="sources"><small>Kilder: Federal Reserve, ECB, Danmarks Nationalbank (Live Update).</small></p>
      </article>\n"""

    with open("arkiv.html", "r", encoding="utf-8") as f:
        arkiv_html = f.read()
    arkiv_html = arkiv_html.replace('<h2>Årgang 2026</h2>', f'<h2>Årgang 2026</h2>\n{new_article}')
    with open("arkiv.html", "w", encoding="utf-8") as f:
        f.write(arkiv_html)

if __name__ == "__main__":
    update_html_files()
